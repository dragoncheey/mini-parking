services:
  api:
    build:
      context: .
    env_file:
      - ${SERVER_ENV_FILE:-.env.server}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_SITE_ADDRESS: ${API_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
