services:
  api:
    build:
      context: .
    env_file:
      - ${SERVER_ENV_FILE:-.env.server}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
